
name: BTC Automatic Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  btc-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests

      - name: Calculate BTC signal
        run: python btc_signal.py

      - name: Save signal report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_signal_report.txt
          git diff --cached --quiet || git commit -m "Update BTC signal report"
          git push
